[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-tichu"
version = "1.0.0"
description = "The Tichu card game in your terminal: four players over the network, full official rules, zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["tichu", "card-game", "terminal", "multiplayer"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
tichu-server = "tichu.server:main"
tichu-client = "tichu.client:main"

[tool.setuptools]
packages = ["tichu"]
