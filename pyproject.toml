[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-tichu"
version = "1.0.0"
description = "The Tichu card game in your terminal: four players over the network or in the browser, full official rules, zero dependencies"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nikos Pnevmatikos" }]
requires-python = ">=3.10"
keywords = ["tichu", "card-game", "terminal", "multiplayer"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.urls]
Repository = "https://github.com/NikPnevmatikos/Terminal-Tichu"

[project.scripts]
tichu-server = "tichu.server:main"
tichu-client = "tichu.client:main"
tichu-web = "tichu.web:main"

[tool.setuptools]
packages = ["tichu"]
